name: announcer

on:
  schedule:
    - cron: "*/15 20-23,0-5 * * *"   # every 15 min, 16:00-02:00 ET
    - cron: "0 6-19 * * *"           # hourly, the quiet part of the day
  workflow_dispatch:
    inputs:
      baseline:
        description: "Record everything as seen and announce nothing. Use once, on first run."
        type: boolean
        default: false
      dry:
        description: "Print what it would post and send nothing. Safe to run any time."
        type: boolean
        default: false

concurrency:
  group: announcer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Announce new transactions to the GM channel
        env:
          PP_CHANNEL_OVERRIDE: ${{ vars.PP_CHANNEL_OVERRIDE }}
          PP_DISCORD_WEBHOOK_TEST: ${{ secrets.PP_DISCORD_PP_BOT_TEST }}
          PP_DISCORD_WEBHOOK: ${{ secrets.PP_DISCORD_26_27_TRANSACTIONS }}
        run: python _tools/pp_announcer.py ${{ inputs.baseline && '--baseline' || '' }} ${{ inputs.dry && '--dry' || '' }}
      - name: Persist state
        run: |
          git config user.name  "powerplay-bot"
          git config user.email "powerplay-bot@users.noreply.github.com"
          git add _tools/state
          git diff --staged --quiet || git commit -m "state: announcer"
          git push
