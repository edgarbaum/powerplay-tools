name: eligibility

on:
  schedule:
    - cron: "15 13 * * *"
    # Same-hour age check after Sunday processing (Fantrax processes at noon Eastern, which is
    # 16:00 or 17:00 UTC across the clock change). Three slots because GitHub skips scheduled
    # runs; the guard below lets only the first SUCCESSFUL one do the extra pass.
    - cron: "30 16 * * 0"
    - cron: "0 17 * * 0"
    - cron: "30 17 * * 0"
  workflow_dispatch:

concurrency:
  group: eligibility
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sunday extra-pass guard (only the three Sunday post-processing slots are guarded)
        id: guard
        run: |
          week=$(date -u +%G-W%V)
          echo "week=$week" >> $GITHUB_OUTPUT
          done=$(cat _tools/state/eligibility_sunday_done 2>/dev/null || true)
          case "${{ github.event.schedule }}" in
            "30 16 * * 0"|"0 17 * * 0"|"30 17 * * 0")
              if [ "$done" = "$week" ]; then
                echo "skip=true" >> $GITHUB_OUTPUT
                echo "Sunday extra pass already done for $week, nothing to do"
              else
                echo "skip=false" >> $GITHUB_OUTPUT
                echo "sunday=true" >> $GITHUB_OUTPUT
              fi ;;
            *) echo "skip=false" >> $GITHUB_OUTPUT ;;
          esac
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Draft-protection sweep, rule 5.2
        id: check
        if: steps.guard.outputs.skip != 'true'
        run: |
          set +e
          python _tools/pp_eligibility_check.py | tee out.txt
          echo "code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      - name: Post to the PRIVATE ops channel, and only on a real violation
        if: steps.check.outputs.code == '3'
        env:
          PP_CHANNEL_OVERRIDE: ${{ vars.PP_CHANNEL_OVERRIDE }}
          PP_DISCORD_WEBHOOK_TEST: ${{ secrets.PP_DISCORD_PP_BOT_TEST }}
          PP_DISCORD_WEBHOOK_OPS: ${{ secrets.PP_DISCORD_COMMISH_OPS }}
          PP_DISCORD_WEBHOOK: ${{ secrets.PP_DISCORD_26_27_TRANSACTIONS }}
        run: python _tools/pp_discord_post.py --ops --gate eligibility --stdin < out.txt
      - name: Mark the Sunday extra pass done
        if: steps.guard.outputs.sunday == 'true' && (steps.check.outputs.code == '0' || steps.check.outputs.code == '3')
        run: echo "${{ steps.guard.outputs.week }}" > _tools/state/eligibility_sunday_done
      - name: Persist the birthdate cache
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "powerplay-bot"
          git config user.email "powerplay-bot@users.noreply.github.com"
          git add _tools/state
          git diff --staged --quiet && exit 0
          git commit -q -m "state: birthdate cache $(date -u +%FT%TZ)"
          # Workflows commit state concurrently, so a plain push loses the race.
          # Rebase onto whatever landed first and try again; state files are
          # append-or-replace per workflow, so there is nothing to merge by hand.
          for i in 1 2 3 4 5; do
            git push -q && exit 0
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase -q origin main || exit 1
            sleep $((i * 3))
          done
          echo "could not push state after 5 attempts"
          exit 1
      - name: Fail loudly if the check itself crashed
        if: steps.guard.outputs.skip != 'true' && steps.check.outputs.code != '0' && steps.check.outputs.code != '3'
        run: |
          echo "check exited ${{ steps.check.outputs.code }}: a crash or a refused canary, NOT a finding"
          exit 1
