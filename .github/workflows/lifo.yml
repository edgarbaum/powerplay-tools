name: lifo

# Constitution 2.4 gives a GM 7 days to cure an illegal roster before the most
# recently acquired MAIN-roster player is auto-dropped. This runs daily so the
# warning lands early in that window, which is the whole point: the auto-drop
# should never have to fire.

on:
  schedule:
    - cron: "45 13 * * *"
  workflow_dispatch:

concurrency:
  group: lifo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: LIFO cure-window watch
        id: check
        run: |
          set +e
          python _tools/pp_lifo_check.py | tee out.txt
          echo "code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      - name: Post to the PRIVATE ops channel, and only when a team is on the clock
        if: steps.check.outputs.code == '1'
        env:
          PP_CHANNEL_OVERRIDE: ${{ vars.PP_CHANNEL_OVERRIDE }}
          PP_DISCORD_WEBHOOK_TEST: ${{ secrets.PP_DISCORD_PP_BOT_TEST }}
          PP_DISCORD_WEBHOOK_OPS: ${{ secrets.PP_DISCORD_COMMISH_OPS }}
          PP_DISCORD_WEBHOOK: ${{ secrets.PP_DISCORD_26_27_TRANSACTIONS }}
        run: python _tools/pp_discord_post.py --ops --stdin < out.txt
      - name: Persist the cure clock
        run: |
          git config user.name  "powerplay-bot"
          git config user.email "powerplay-bot@users.noreply.github.com"
          git add _tools/state
          git diff --staged --quiet && exit 0
          git commit -q -m "state: lifo cure clock $(date -u +%FT%TZ)"
          # Workflows commit state concurrently, so a plain push loses the race.
          # Rebase onto whatever landed first and try again; state files are
          # append-or-replace per workflow, so there is nothing to merge by hand.
          for i in 1 2 3 4 5; do
            git push -q && exit 0
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase -q origin main || exit 1
            sleep $((i * 3))
          done
          echo "could not push state after 5 attempts"
          exit 1
