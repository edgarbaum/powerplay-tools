name: mgp

# Weekly MGP tracker, constitution v25 section 5.5: 1,200 man-games played in ACTIVE
# slots. READ ONLY. Findings go to the TEST channel only.
#
# GitHub skips many scheduled runs, so four are scheduled (09, 10, 11, 12 UTC, which
# is 5 to 8 a.m. Eastern, after the day's scoring has settled) and a once-per-day
# marker in _tools/state/ makes only the first SUCCESSFUL one do the work. The marker
# is written after the check and the post both succeeded; a run that crashed, or whose
# standings witness refused, leaves it unset and the next slot retries. Manual and
# push runs ignore the marker: they are someone asking.

on:
  # EB 2026-10-05: weekly, Mondays at 3 to 4 a.m. Eastern, once. Cron is UTC and GitHub runs
  # scheduled jobs late or not at all, so four Monday slots are scheduled (07:00 to 10:00 UTC,
  # which covers 3 to 4 a.m. Eastern before and after the Nov 1 clock change) and the
  # once-per-week guard below lets only the first successful one do the work.
  schedule:
    - cron: "0 7 * * 1"
    - cron: "0 8 * * 1"
    - cron: "0 9 * * 1"
    - cron: "0 10 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "_tools/pp_mgp.py"
      - ".github/workflows/mgp.yml"

concurrency:
  group: mgp
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Once-per-day guard
        id: guard
        run: |
          today=$(date -u +%G-W%V)          # once per ISO week
          echo "today=$today" >> $GITHUB_OUTPUT
          echo "weekday=$(date -u +%u)" >> $GITHUB_OUTPUT
          done=$(cat _tools/state/mgp_done 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$done" = "$today" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "already done for $today, nothing to do"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: MGP tracker, daily rosters against the standings
        id: check
        if: steps.guard.outputs.skip != 'true'
        run: |
          set +e
          python _tools/pp_mgp.py --post-out "$RUNNER_TEMP/post.txt" | tee "$RUNNER_TEMP/out.txt"
          echo "code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      - name: Keep the full report, every team
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mgp-report
          path: ${{ runner.temp }}/out.txt
          if-no-files-found: ignore
      - name: Post to the TEST channel, on code pushes only (the weekly post below is the real one)
        if: steps.guard.outputs.skip != 'true' && steps.check.outputs.code == '3' && github.event_name == 'push'
        env:
          PP_CHANNEL_OVERRIDE: ${{ vars.PP_CHANNEL_OVERRIDE }}
          PP_DISCORD_WEBHOOK_TEST: ${{ secrets.PP_DISCORD_PP_BOT_TEST }}
        run: python _tools/pp_discord_post.py --test --gate mgp --stdin < "$RUNNER_TEMP/post.txt"
      - name: One-time launch of #26-27-team-gp-tracker, the pin-able intro first (EB 2026-10-05)
        id: launch
        if: steps.guard.outputs.skip != 'true' && hashFiles('_tools/state/gp_launched') == ''
        env:
          PP_CHANNEL_OVERRIDE: ${{ vars.PP_CHANNEL_OVERRIDE }}
          PP_DISCORD_WEBHOOK_GP: ${{ secrets.PP_DISCORD_26_27_TEAM_GP_TRACKER }}
          PP_DISCORD_WEBHOOK_TEST: ${{ secrets.PP_DISCORD_PP_BOT_TEST }}
        run: |
          if [ -z "$PP_DISCORD_WEBHOOK_GP" ]; then echo "no gp webhook, launch waits"; exit 0; fi
          python _tools/pp_discord_post.py --gp "$(cat _tools/gp_tracker_intro.md)"
          echo "go=true" >> $GITHUB_OUTPUT
      - name: Weekly post to #26-27-team-gp-tracker (Mondays), falling back to TEST until its webhook exists
        # EB 2026-10-05: "I'd like to start having that update weekly." Monday covers the week through
        # Sunday's processing. Until the repo secret PP_DISCORD_26_27_TEAM_GP_TRACKER is added, the weekly
        # post goes to the test channel, so nothing fails while the channel is being set up.
        if: steps.guard.outputs.skip != 'true' && (steps.check.outputs.code == '0' || steps.check.outputs.code == '3') && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.launch.outputs.go == 'true')
        env:
          PP_CHANNEL_OVERRIDE: ${{ vars.PP_CHANNEL_OVERRIDE }}
          PP_DISCORD_WEBHOOK_TEST: ${{ secrets.PP_DISCORD_PP_BOT_TEST }}
          PP_DISCORD_WEBHOOK_GP: ${{ secrets.PP_DISCORD_26_27_TEAM_GP_TRACKER }}
        run: |
          if [ -n "$PP_DISCORD_WEBHOOK_GP" ]; then ch=--gp; else ch=--test; echo "no gp webhook yet, posting weekly to test"; fi
          python _tools/pp_discord_post.py $ch --gate mgp-weekly --stdin < "$RUNNER_TEMP/post.txt"
      - name: Record the launch so it never repeats
        if: steps.launch.outputs.go == 'true'
        run: date -u +%FT%TZ > _tools/state/gp_launched
      - name: Mark today done
        if: steps.guard.outputs.skip != 'true' && (steps.check.outputs.code == '0' || steps.check.outputs.code == '3')
        run: echo "${{ steps.guard.outputs.today }}" > _tools/state/mgp_done
      - name: Persist state
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "powerplay-bot"
          git config user.email "powerplay-bot@users.noreply.github.com"
          git add _tools/state
          git diff --staged --quiet && exit 0
          git commit -q -m "state: mgp $(date -u +%FT%TZ)"
          # Workflows commit state concurrently, so a plain push loses the race.
          # Rebase onto whatever landed first and try again.
          for i in 1 2 3 4 5; do
            git push -q && exit 0
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase -q origin main || exit 1
            sleep $((i * 3))
          done
          echo "could not push state after 5 attempts"
          exit 1
      - name: Fail loudly if the check itself crashed or the witness refused
        if: steps.guard.outputs.skip != 'true' && steps.check.outputs.code != '0' && steps.check.outputs.code != '3'
        run: |
          echo "check exited ${{ steps.check.outputs.code }}: a crash or a refused witness, NOT a finding"
          exit 1
