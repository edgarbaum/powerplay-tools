name: orders

# Posts a claim order to its channel, and ONLY when the order has changed.
# Runs automatically whenever _tools/state/orders.json is committed, which is the
# moment an order actually moves, so the channel mirrors the state file rather
# than being maintained by hand.

on:
  push:
    paths: ["_tools/state/orders.json"]
  workflow_dispatch:
    inputs:
      which:
        description: "Which order to post."
        type: choice
        options: [both, fa, waiver]
        default: both
      force:
        description: "Post even if unchanged. Use for the first post into a new channel."
        type: boolean
        default: false

concurrency:
  group: orders
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post the order(s)
        env:
          PP_CHANNEL_OVERRIDE: ${{ vars.PP_CHANNEL_OVERRIDE }}
          PP_DISCORD_WEBHOOK_TEST: ${{ secrets.PP_DISCORD_PP_BOT_TEST }}
          PP_DISCORD_WEBHOOK_FA: ${{ secrets.PP_DISCORD_26_27_FA_CLAIM_ORDER }}
          PP_DISCORD_WEBHOOK_WAIVER: ${{ secrets.PP_DISCORD_26_27_WAIVER_ORDER }}
          WHICH: ${{ inputs.which || 'both' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          set -e
          [ "$WHICH" = "waiver" ] || python _tools/pp_order_post.py --fa $FORCE
          [ "$WHICH" = "fa" ]     || python _tools/pp_order_post.py --waiver $FORCE
      - name: Persist the posted fingerprints
        run: |
          git config user.name  "powerplay-bot"
          git config user.email "powerplay-bot@users.noreply.github.com"
          git add _tools/state
          git diff --staged --quiet && exit 0
          git commit -q -m "state: orders posted $(date -u +%FT%TZ)"
          # Workflows commit state concurrently, so a plain push loses the race.
          # Rebase onto whatever landed first and try again; state files are
          # append-or-replace per workflow, so there is nothing to merge by hand.
          for i in 1 2 3 4 5; do
            git push -q && exit 0
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase -q origin main || exit 1
            sleep $((i * 3))
          done
          echo "could not push state after 5 attempts"
          exit 1
