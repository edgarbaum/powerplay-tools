name: trade-clock

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

concurrency:
  group: trade-clock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pending trade bill clock, PRIVATE ops channel
        env:
          PP_CHANNEL_OVERRIDE: ${{ vars.PP_CHANNEL_OVERRIDE }}
          PP_DISCORD_WEBHOOK_OPS: ${{ secrets.PP_DISCORD_COMMISH_OPS }}
          PP_DISCORD_WEBHOOK: ${{ secrets.PP_DISCORD_26_27_TRANSACTIONS }}
        run: python _tools/pp_trade_clock.py
      - name: Persist state
        run: |
          git config user.name  "powerplay-bot"
          git config user.email "powerplay-bot@users.noreply.github.com"
          git add _tools/state
          git diff --staged --quiet || git commit -m "state: trade clock"
          git push
